name: Scrape latest data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "0 10 * * 1-5"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      FAILURE_TITLE: Scraper is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch latest data
        run: node fetch.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}" || exit 0
          git push

      - name: Open or update an issue if the scrape failed
        if: failure()
        run: |
          number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == env.FAILURE_TITLE) | .number' | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$FAILURE_TITLE" --body "@${{ github.repository_owner }} the scheduled scrape failed: $RUN_URL. This issue closes itself after the next successful run."
          fi

      - name: Close the failure issue once the scrape works again
        if: success()
        run: |
          for number in $(gh issue list --state open --json number,title --jq '.[] | select(.title == env.FAILURE_TITLE) | .number'); do
            gh issue close "$number" --comment "Working again: $RUN_URL"
          done
